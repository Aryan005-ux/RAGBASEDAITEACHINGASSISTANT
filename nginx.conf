user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning for High Throughput
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 2048M;

    # Upstream definition pointing to Docker container replicas
    upstream api_servers {
        # Round-robin load balancing
        server api:8000;
        
        # Keepalive connections to upstream uvicorn servers to reduce connection overhead
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck endpoint directly handled by Nginx or passed through
        location /health {
            proxy_pass http://api_servers/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Route all other API requests to the upstream uvicorn cluster
        location / {
            proxy_pass http://api_servers;
            
            # Setup HTTP/1.1 for connection keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Header configurations
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timing configurations
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Stream uploads and chat answers straight through instead of buffering them
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
